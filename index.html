<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Asystent Bogdan</title>

<style>

body{
    margin:0;
    background:#ffebf4;
    font-family:Arial,sans-serif;
    height:100vh;
    display:flex;
    flex-direction:column;
}


.header{
    background:linear-gradient(135deg,#ff4fa0,#c2185b);
    text-align:center;
    padding:25px 10px;
    box-shadow:0 4px 15px rgba(0,0,0,0.2);
}
    
.logo{
    width:280px;
    max-width:90%;
    display:block;
    margin:0 auto;
}
    
.chat{
    flex:1;
    overflow-y:auto;
    padding:15px;
}

.bot{
    background:white;
    padding:12px;
    border-radius:18px;
    max-width:75%;
    margin-bottom:12px;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.user{
    background:#ff4fa0;
    color:white;
    padding:12px;
    border-radius:18px;
    max-width:75%;
    margin-left:auto;
    margin-bottom:12px;
}

.input-area{
    display:flex;
    gap:10px;
    padding:15px;
    background:white;
}

input{
    flex:1;
    padding:12px;
    border-radius:20px;
    border:1px solid #ddd;
    font-size:16px;
}

button{
    border:none;
    border-radius:20px;
    padding:12px 18px;
    background:#ff4fa0;
    color:white;
    font-size:16px;
}

</style>
</head>

<body>

<div class="header">

    <img src="logo.png" class="logo">

</div>

<div class="chat">

    <div class="bot">
        Cześć Agata 👋<br><br>
        Mogę pomagać z:
        <br>📅 kalendarzem
        <br>📧 mailami
        <br>⏰ przypomnieniami
        <br>📝 notatkami
    </div>

    <div class="user">
        Dodaj jutro trening brzucha o 16:00
    </div>

</div>

<div class="input-area">
    <input type="text" placeholder="Napisz wiadomość...">
    <button>🎤</button>
    <button>➤</button>
</div>

</body>
</html>
