<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Twój osobisty asystent</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,sans-serif;
    background:linear-gradient(180deg,#ffb6d9,#3b061b);
    color:white;
    display:flex;
    flex-direction:column;
}

.header{
    text-align:center;
    padding:28px 16px 18px;
}

.logo{
    width:260px;
    max-width:90%;
    border-radius:24px;
}

.subtitle{
    margin-top:10px;
    font-size:15px;
    opacity:.9;
}

.chat{
    flex:1;
    padding:18px;
    overflow-y:auto;
}

.message{
    max-width:82%;
    padding:14px 16px;
    border-radius:22px;
    margin-bottom:14px;
    font-size:17px;
    line-height:1.35;
    box-shadow:0 8px 22px rgba(0,0,0,.18);
}

.bot{
    background:white;
    color:#331021;
    border-top-left-radius:6px;
}

.user{
    background:#ff4fa0;
    color:white;
    margin-left:auto;
    border-top-right-radius:6px;
}

.quick{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    padding:0 18px 12px;
}

.quick button{
    background:rgba(255,255,255,.18);
    color:white;
    border:1px solid rgba(255,255,255,.25);
    padding:12px;
    border-radius:18px;
    font-size:15px;
}

.input-area{
    display:flex;
    gap:8px;
    padding:14px;
    background:rgba(20,0,10,.88);
    position:sticky;
    bottom:0;
}

input{
    flex:1;
    border:none;
    border-radius:22px;
    padding:14px 16px;
    font-size:16px;
    outline:none;
}

.send,.mic{
    border:none;
    border-radius:50%;
    width:48px;
    height:48px;
    font-size:20px;
    background:#ff4fa0;
    color:white;
}
</style>
</head>

<body>

<div class="header">
    <img src="/static/logo.png" class="logo">
    <div class="subtitle">Twój osobisty asystent AI</div>
</div>

<div class="chat" id="chat">
    <div class="message bot">
        Cześć Agata 👋<br><br>
        Jestem gotowy do pomocy z kalendarzem, mailami, przypomnieniami i zadaniami.
    </div>

    <div class="message user">
        Dodaj jutro trening brzucha o 16:00
    </div>
</div>

<div class="quick">
    <button>📅 Co mam jutro?</button>
    <button>⏰ Dodaj przypomnienie</button>
    <button>📧 Sprawdź maile</button>
    <button>📝 Dodaj zadanie</button>
</div>

<div class="input-area">
    <input id="messageInput" type="text" placeholder="Napisz lub podyktuj polecenie...">
    <button class="mic">🎤</button>
    <button class="send">➤</button>
</div>

</body>
</html>
